[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mace-core"
dynamic = ["version"]
description = "Framework-agnostic contract and pure math for MACE v1."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "MACE developers" }]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
# numpy is the array type every value in this package is expressed over, and
# pydantic validates the declarations a user writes by hand. tomli reads the
# configuration files on the Python versions whose standard library has no
# tomllib.
#
# ase is here deliberately, and it is the one dependency that looks like it
# does not belong in a framework-agnostic package. The extended-XYZ contract
# this package parses is *defined* in terms of ase: which of info/arrays a key
# lands in, which keys are reserved for calculator results, how a cell and its
# periodic-boundary flags are spelled. Reimplementing that would mean
# reimplementing ase's decisions and then differing from them on some file
# nobody tested. ase brings in no framework of its own, so the purity rule --
# no torch, no jax, no e3nn -- is untouched. The floor is 3.23 because that is
# the release whose reserved-key behaviour the parser is written against.
dependencies = [
    "numpy>=1.23",
    "ase>=3.23",
    # The suite passes at this floor (2.7.4 on Python 3.10) and at current
    # releases.
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tomli>=2.0",
    # The neighbour list. Imported inside `get_neighborhood` rather than at the
    # top, because it is the one heavy import here and a caller that only wants
    # a `Configuration` should not pay for it; deferring an import does not
    # make the dependency optional, and a distribution that did not declare it
    # installs clean and then raises the first time a graph is built.
    "matscipy>=0.8",
    # The neutral weights format. Read and written through its numpy module,
    # which needs no framework.
    "safetensors>=0.4",
]

[project.entry-points."mace.data_backends"]
# One backend is one module and one line here. A third-party wheel declares
# into the same group and is discovered with no edit in this repository.
xyz = "mace_core.data.backends.xyz:XYZBackend"

[project.urls]
Homepage = "https://github.com/ACEsuit/mace"

# No [project.scripts]. Every mace_* console entry point is owned by one
# distribution, mace-launcher; two distributions declaring the same script name
# is undefined behaviour in pip.

[tool.hatch.version]
source = "vcs"
# Tag prefixes are keyed on the directory, not the distribution name, so each
# package versions independently and renaming a distribution leaves the tag
# scheme alone. --match stops git describe resolving a sibling's tag or a
# legacy v0.3.x one, which tag-pattern would then reject outright.
tag-pattern = "^mace-core-v(?P<version>.+)$"
fallback-version = "0.0.0"
raw-options = { root = "../..", git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "mace-core-v*"] }

[tool.hatch.build.targets.wheel]
packages = ["src/mace_core"]
